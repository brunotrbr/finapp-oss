name: Build backend

on:
    push:
        branches: [main, develop]
        paths:
        - 'finapp/backend/**'
        - 'finapp/backend.tests/**'
    pull_request:
        branches: [main, develop]
        paths:
        - 'finapp/backend/**'
        - 'finapp/backend.tests/**'

env:
    DOTNET_CONFIGURATION: Release
    DOTNET_VERSION: '10.0'

defaults:
    run:
        working-directory: finapp/backend

jobs:
    check-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Cache NuGet packages
              uses: actions/cache@v4
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ hashFiles('finapp/backend/packages.lock.json', 'finapp/backend.tests/packages.lock.json') }}-${{ hashFiles('finapp/backend/*.csproj', 'finapp/backend.tests/*.csproj') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget-

            - name: Restore dependencies
              run: dotnet restore ../backend.tests/Finapp.Api.Tests.csproj --locked-mode

            - name: Build
              run: dotnet build ../backend.tests/Finapp.Api.Tests.csproj --configuration ${{ env.DOTNET_CONFIGURATION }} --no-restore

            - name: Test
              run: dotnet test ../backend.tests/Finapp.Api.Tests.csproj --configuration ${{ env.DOTNET_CONFIGURATION }} --no-build --verbosity normal