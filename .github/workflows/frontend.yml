name: Build frontend
on:
    push:
        branches: [main, develop]
        paths:
        - 'finapp/frontend/**'
    pull_request:
        branches: [main, develop]
        paths:
        - 'finapp/frontend/**'
defaults:
    run:
        working-directory: finapp/frontend
jobs:
    check-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with: 
                cache-dependency-path: finapp/frontend/package-lock.json
                node-version: '24'
                cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: List
              run: npm run lint
            