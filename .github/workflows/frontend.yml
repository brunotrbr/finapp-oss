name: Build frontend
on:
    push:
        branches: [main, develop]
        paths:
        - 'finapp/frontend/**'
    pull_request:
        branches: [main, develop]
        paths:
        - 'finapp/frontend/**'
defaults:
    run:
        working-directory: finapp/frontend
jobs:
    check-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with: 
                cache-dependency-path: finapp/frontend/package-lock.json
                node-version: '24'
                cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Unit and component tests
              run: npm run test:run

            - name: Build
              run: npm run build

            - name: Typecheck with generated Next.js types
              run: npx tsc --noEmit

            - name: Lint
              run: npm run lint

            - name: Install Playwright browser
              run: npx playwright install --with-deps chromium

            - name: Browser tests
              run: npm run test:e2e

            - name: API-intercepted browser tests
              run: npm run test:e2e -- e2e/finance-api.spec.ts
              env:
                NEXT_PUBLIC_FINAPP_DATA_SOURCE: api
                NEXT_PUBLIC_API_BASE_URL: https://api.e2e.test
                FINAPP_E2E_PORT: '3101'
                FINAPP_E2E_DIST_DIR: .next-e2e-api
