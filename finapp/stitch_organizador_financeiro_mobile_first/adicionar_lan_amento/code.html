<!-- Quick Category Chips -->

<button class="cat-pill flex items-center gap-2.5 p-3 rounded-xl bg-surface-container-lowest border border-outline-variant/30 text-on-surface shadow-sm text-left transition-all hover:bg-surface-container-low" onclick="selectCat(this, 'Transporte')" type="button">
<div class="w-7 h-7 rounded-lg bg-surface-container flex items-center justify-center text-on-surface-variant">

</button>
<button class="cat-pill flex items-center gap-2.5 p-3 rounded-xl bg-surface-container-lowest border border-outline-variant/30 text-on-surface shadow-sm text-left transition-all hover:bg-surface-container-low" onclick="selectCat(this, 'Lazer')" type="button">
<div class="w-7 h-7 rounded-lg bg-surface-container flex items-center justify-center text-on-surface-variant">

<!-- Inline Drawer para Criar Nova Categoria (Sem perder estado) -->

<button class="h-10 px-4 bg-primary-container text-on-primary rounded-lg font-label-md text-label-md flex items-center justify-center active:scale-95 transition-transform shadow-sm" onclick="addNewCategoryBadge()" type="button">

<script>
  let currentType = 'saida';

  function setType(type) {
    currentType = type;
    const btnEntrada = document.getElementById('btn-tipo-entrada');
    const btnSaida = document.getElementById('btn-tipo-saida');
    const badgeLabel = document.getElementById('type-badge-label');
    const currSymbol = document.getElementById('currency-symbol');
    const badgeContainer = badgeLabel.parentElement;

    if (type === 'saida') {
      btnSaida.className = 'flex-1 py-2.5 px-space-md rounded-lg flex items-center justify-center gap-2 bg-primary-container text-on-primary shadow-md transition-all duration-200';
      btnSaida.querySelector('span:first-child').className = 'material-symbols-outlined text-[18px] text-secondary-fixed';
      btnSaida.querySelector('span:last-child').className = 'font-label-lg text-label-lg font-bold';

      btnEntrada.className = 'flex-1 py-2.5 px-space-md rounded-lg flex items-center justify-center gap-2 text-on-surface-variant transition-all duration-200';
      btnEntrada.querySelector('span:first-child').className = 'material-symbols-outlined text-[18px]';
      btnEntrada.querySelector('span:last-child').className = 'font-label-lg text-label-lg';

      badgeLabel.textContent = 'Despesa imediata';
      currSymbol.className = 'font-headline-lg text-headline-lg text-error font-bold transition-colors';
      badgeContainer.className = 'inline-flex items-center gap-1 mt-2 px-2.5 py-0.5 rounded-full bg-error-container text-on-error-container text-body-sm font-label-md';
      badgeContainer.querySelector('.material-symbols-outlined').textContent = 'trending_down';
    } else {
      btnEntrada.className = 'flex-1 py-2.5 px-space-md rounded-lg flex items-center justify-center gap-2 bg-primary-container text-on-primary shadow-md transition-all duration-200';
      btnEntrada.querySelector('span:first-child').className = 'material-symbols-outlined text-[18px] text-secondary-fixed';
      btnEntrada.querySelector('span:last-child').className = 'font-label-lg text-label-lg font-bold';

      btnSaida.className = 'flex-1 py-2.5 px-space-md rounded-lg flex items-center justify-center gap-2 text-on-surface-variant transition-all duration-200';
      btnSaida.querySelector('span:first-child').className = 'material-symbols-outlined text-[18px]';
      btnSaida.querySelector('span:last-child').className = 'font-label-lg text-label-lg';

      badgeLabel.textContent = 'Receita em conta';
      currSymbol.className = 'font-headline-lg text-headline-lg text-secondary font-bold transition-colors';
      badgeContainer.className = 'inline-flex items-center gap-1 mt-2 px-2.5 py-0.5 rounded-full bg-secondary-container text-on-secondary-container font-label-md text-body-sm';
      badgeContainer.querySelector('.material-symbols-outlined').textContent = 'trending_up';
    }
  }

  function formatCurrency(input) {
    let value = input.value.replace(/\D/g, '');
    if (!value) {
      input.value = '0,00';
      return;
    }
    value = (parseInt(value, 10) / 100).toFixed(2) + '';
    value = value.replace(".", ",");
    value = value.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
    input.value = value;
  }

  function selectCat(element, name) {
    document.querySelectorAll('.cat-pill').forEach(btn => {
      btn.className = 'cat-pill flex items-center gap-2.5 p-3 rounded-xl bg-surface-container-lowest border border-outline-variant/30 text-on-surface shadow-sm text-left transition-all hover:bg-surface-container-low';
      const iconWrap = btn.querySelector('div:first-child');
      iconWrap.className = 'w-7 h-7 rounded-lg bg-surface-container flex items-center justify-center text-on-surface-variant';
      btn.querySelector('span.font-label-md').className = 'font-label-md text-label-md truncate text-on-surface';
      const sub = btn.querySelector('span.font-body-sm');
      if (sub) sub.className = 'font-body-sm text-body-sm text-on-surface-variant truncate';
    });

    element.className = 'cat-pill active flex items-center gap-2.5 p-3 rounded-xl bg-primary-container text-on-primary shadow-sm text-left transition-all border border-primary-container';
    element.querySelector('div:first-child').className = 'w-7 h-7 rounded-lg bg-primary text-secondary-fixed flex items-center justify-center';
    element.querySelector('span.font-label-md').className = 'font-label-md text-label-md font-bold truncate text-on-primary';
    const subSelected = element.querySelector('span.font-body-sm');
    if (subSelected) subSelected.className = 'font-body-sm text-body-sm text-secondary-fixed truncate';
  }

  function openNewCategoryInline() {
    const drawer = document.getElementById('inline-category-create');
    drawer.classList.toggle('hidden');
    drawer.classList.toggle('flex');
    if (!drawer.classList.contains('hidden')) {
      document.getElementById('new-cat-name').focus();
    }
  }

  function addNewCategoryBadge() {
    const input = document.getElementById('new-cat-name');
    const val = input.value.trim();
    if (!val) return;

    const chipsContainer = document.getElementById('category-chips');
    const newBtn = document.createElement('button');
    newBtn.type = 'button';
    newBtn.onclick = function() { selectCat(this, val); };
    newBtn.className = 'cat-pill flex items-center gap-2.5 p-3 rounded-xl bg-surface-container-lowest border border-outline-variant/30 text-on-surface shadow-sm text-left transition-all hover:bg-surface-container-low';
    newBtn.innerHTML = `
      <div class="w-7 h-7 rounded-lg bg-surface-container flex items-center justify-center text-on-surface-variant">
        <span class="material-symbols-outlined text-[18px]">label</span>
      </div>
      <div class="flex flex-col min-w-0">
        <span class="font-label-md text-label-md truncate">${val}</span>
        <span class="font-body-sm text-body-sm text-on-surface-variant truncate">Personalizado</span>
      </div>
    `;

    chipsContainer.appendChild(newBtn);
    selectCat(newBtn, val);
    input.value = '';
    document.getElementById('inline-category-create').classList.add('hidden');
    document.getElementById('inline-category-create').classList.remove('flex');
  }

  function pulseNotice(el) {
    el.classList.add('bg-surface-container-highest');
    setTimeout(() => {
      el.classList.remove('bg-surface-container-highest');
    }, 200);
  }

  function handleSave() {
    const btn = document.getElementById('btn-salvar');
    const label = document.getElementById('btn-save-text');
    const icon = document.getElementById('btn-save-icon');

    // Visual feedback state
    btn.disabled = true;
    btn.classList.add('opacity-90', 'scale-[0.98]');
    label.textContent = 'Gravando...';
    icon.textContent = 'progress_activity';
    icon.classList.add('animate-spin');

    setTimeout(() => {
      icon.classList.remove('animate-spin');
      icon.textContent = 'task_alt';
      label.textContent = 'Lançamento salvo!';
      btn.classList.remove('bg-primary-container');
      btn.classList.add('bg-secondary', 'text-on-secondary');

      setTimeout(() => {
        history.back();
      }, 700);
    }, 900);
  }
</script></main>
</body></html>
